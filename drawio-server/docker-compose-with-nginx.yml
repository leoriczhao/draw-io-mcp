services:
  drawio:
    build: .
    ports:
      - "18080:8080"
    volumes:
      - ./plugins:/usr/local/tomcat/webapps/draw/plugins
    environment:
      - DRAWIO_SELF_CONTAINED=1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "18443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - drawio
    restart: unless-stopped
